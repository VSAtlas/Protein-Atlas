[pytest]
addopts = --ignore=chemdb/tests/test_modes_integration.py
markers =
    fast: lightweight unit or documentation tests with no external tool dependency
    ions_acceptance: offline ions retention acceptance tests
    slow: full-run integration covering main.py end-to-end
    network: tests requiring external network access
    integration: end-to-end or heavy integration coverage requiring full pipeline
    external_tool: tests that exercise wrappers or behavior around external binaries
    report: generated report, heatmap, provenance, or reporting metadata tests
