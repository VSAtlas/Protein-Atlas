name: WSL smoke
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: wsl-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: [self-hosted, linux, wsl, docking]
    steps:
      - uses: actions/checkout@v4

      - name: Python version
        shell: bash
        run: python3 -V

      - name: Install deps if requirements.txt exists
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -U pip
            python3 -m pip install -r requirements.txt
          else
            echo "No requirements.txt; skipping."
          fi

      - name: Run smoke test
        shell: bash
        env:
          REDUCE_EXE: /mnt/e/phenix/Library/bin/reduce.exe
        run: |
          set -e
          if [ -x scripts/run_smoketest.py ]; then
            python3 scripts/run_smoketest.py
          else
            echo "No scripts/run_smoketest.py yet; placeholder check:"
            python3 - <<'PY'
print("placeholder smoke OK")
PY
          fi

      - name: Upload artifacts (if present)
        uses: actions/upload-artifact@v4
        with:
          name: smoketest_out
          path: smoketest_out
          if-no-files-found: ignore

