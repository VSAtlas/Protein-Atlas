# === atom & element rules ===
element_sets:
  # Atom names that make a HET look peptide-like; in these, derive by atom name.
  peptide_like_names:
    - N; CA; C; O; OXT; CB; CG; CG1; CG2; CD; CD1; CD2; CE; CE1; CE2; CE3; CZ; CZ1; CZ2; CZ3; CH; CH1; CH2; OH
    - ND; ND1; ND2; NE; NE1; NE2; NZ; NH; NH1; NH2
    - OD; OD1; OD2; OE; OE1; OE2; OG; OG1
    - SD; SG

  # Map leading name prefixes to elements (first two chars of atom name)
  derive_prefix_map:
    # Oxygen (side chains, nucleic acids, legacy variants)
    OE: O
    OG: O
    OH: O
    OD: O
    OT: O
    OP: O
    O1: O
    O2: O
    O3: O
    O4: O
    O5: O
    # Nitrogen
    NE: N
    ND: N
    NH: N
    NZ: N
    N1: N
    N2: N
    # Sulfur
    SD: S
    SG: S
    # Carbon (aliphatic/aromatic)
    CE: C
    CD: C
    CG: C
    CZ: C
    CH: C
    # Phosphorus (incl. alt labels seen in nucleotides)
    P:  P
    PA: P
    PB: P
    PG: P
    PN: P

  # Special atom names → element (exact matches; covers nucleic-acid primes and P variants)
  special_atom_names:
    OXT: O
    SE: Se
    O1P: O
    O2P: O
    O3P: O
    "O5'": O
    "O3'": O
    "O2'": O
    "C5'": C
    "C4'": C
    "C3'": C
    "C2'": C
    "C1'": C
    PA: P
    PB: P
    PG: P
    PN: P
    P1: P
    P2: P
    P3: P

  # One-letter PDB element symbols (incl. D/U/W/Y/V commonly seen)
  one_letter_elements: [H, C, N, O, F, P, S, K, V, I, B, Y, W, U, D]

  # Two-letter symbols (full IUPAC; case normalized by code)
  two_letter_elements:
    - He; Li; Be; Ne; Na; Mg; Al; Si; Cl; Ar; Ca; Sc; Ti; Cr; Mn; Fe; Co; Ni; Cu; Zn
    - Ga; Ge; As; Se; Br; Kr; Rb; Sr; Zr; Nb; Mo; Tc; Ru; Rh; Pd; Ag; Cd; In; Sn; Sb; Te; Xe
    - Cs; Ba; La; Ce; Pr; Nd; Pm; Sm; Eu; Gd; Tb; Dy; Ho; Er; Tm; Yb; Lu
    - Hf; Ta; Re; Os; Ir; Pt; Au; Hg; Tl; Pb; Bi; Po; At; Rn; Fr; Ra
    - Ac; Th; Pa; Np; Pu; Am; Cm; Bk; Cf; Es; Fm; Md; No; Lr
    - Rf; Db; Sg; Bh; Hs; Mt; Ds; Rg; Cn; Nh; Fl; Mc; Lv; Ts; Og

  # Halide residue names to treat as elemental ions
  halide_resnames: [CL, BR, I, F, AT]

  # Aliases/charged forms → canonical halide
  halide_resname_aliases:
    IOD: I
    BRO: BR
    CLO: CL
    FLO: F
    "CL-": CL
    "BR-": BR
    "I-": I
    "F-": F
    "AT-": AT

  # Cation aliases (common PDB variations)
  cation_resname_aliases:
    "K+": K
    "NA+": NA
    "CA2+": CA
    "MG2+": MG
    "ZN2+": ZN
    "FE2+": FE
    "FE3+": FE
    "MN2+": MN
    "CU2+": CU
    "CO2+": CO
    "NI2+": NI
    SOD: NA
    POT: K
    CES: CS
    RUB: RB
    CAL: CA
    MAG: MG

  # Safety toggles / defaults
  treat_backbone_CA_as_C: true
  default_element: C

# Keep these in the receptor (not extracted as small ligands)
retain_in_receptor_resnames:
  # Water
  - HOH; WAT; DOD; H2O; TIP; TIP3; SOL
  # Monatomic ions (alkali, alkaline earth, transition, coinage, halides, heavy)
  - LI; NA; K; RB; CS
  - MG; CA; SR; BA
  - ZN; MN; FE; CO; NI; CU
  - AL; CD; HG; PB; AG; AU; PT
  - MO; RU; RH; PD
  - CL; BR; I; F; AT
  # Lanthanides / actinides sometimes present
  - LA; CE; PR; ND; PM; SM; EU; GD; TB; DY; HO; ER; TM; YB; LU
  - U; TH
  # Metal clusters
  - FES; SF4; F3S; F4S; FE2; FE3; CU1; CU2; ZN2; 3NI; 2FE; 4FE; 3CO
  # Cofactors / prosthetic groups
  - HEM; HEC; HEB; HEA; HEME
  - FAD; FMN; FADH; FMNH
  - NAD; NADH; NADP; NAP; NMN
  - SAM; SAH
  - PLP; TPP
  - ATP; ADP; AMP; GTP; GDP; CTP; UTP; TTP
  - COA
  - BTN
  - MGD; MPT
  # Modified amino acids / capping
  - MSE
  - SEC; PYL
  - SEP; TPO; PTR
  - ACE; NME
  - CBL; COB; CNC         # cobalamin
  - H4B; BH4; THB         # tetrahydrobiopterin
  - HEO                   # heme O
  - PQQ                   # pyrroloquinoline quinone
  - PMP                   # pyridoxamine-5'-phosphate
  - LLP                   # PLP-lysine Schiff base (covalent)
  - F420                  # deazaflavin cofactor


# Common solvents / buffers / cryo / detergents that should be extracted (never chosen as ligand)
remove_as_solvent_resnames:
  - GOL; EDO; PG4; PGO; PEO; PEG; MPD; ACT; ACY; CIT; TLA
  - TRS; MES; HEP; HEPES; MOPS; PIP; PIPES; BIS; BIC; BME; DTT
  - IPA; IPAH; DMS; DMSO; ACN; EOH; ETH; LAC; FMT; MLI
  - BOG; BDN; LDAO; DDM; CHS; CHOL; OLA; OLC; OCT; UND
  - SO4; PO4; EPE; MPD; NME; ACE
  - CL; BR; I; F  # (kept as ions if monatomic; here stops them being ligand picks)

# Glycans / sugars
remove_as_glycan_resnames:
  - NAG; NDG; BMA; MAN; FUC; GAL; GLC; NNN; SIA; SIR; A2G; A2M

